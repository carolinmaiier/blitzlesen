* { box-sizing:border-box; }

html, body, body *, button, input, select, textarea {
  font-family:"nekoneko","Trebuchet MS",Arial,sans-serif !important;
}

body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:linear-gradient(145deg,var(--bg1),var(--bg2));
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:24px 14px 40px;
}

.app {
  width:min(820px,100%);
  text-align:center;
}

h1 {
  margin:6px 0 4px;
  font-size:clamp(34px,6vw,56px);
  letter-spacing:.5px;
  font-weight:700;
}

.subtitle {
  margin:0 0 20px;
  color:var(--muted);
  font-size:18px;
}

.card {
  background:var(--card);
  border-radius:24px;
  padding:24px;
  box-shadow:var(--shadow);
  margin-top:18px;
}

.hidden { display:none !important; }

.grid,
.speed-row,
.partner-row {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

button {
  border:0;
  border-radius:16px;
  padding:14px 20px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  color:var(--text);
  background:#f3efe9;
  min-height:52px;
  transition:transform .08s ease, opacity .15s ease, box-shadow .15s ease;
  touch-action:manipulation;
}

button:hover {
  box-shadow:0 8px 18px rgba(100,78,45,.10);
}

button:active { transform:scale(.98); }
button:disabled { opacity:.45; cursor:default; }

.big-choice {
  background:var(--yellow2);
  color:#76551f;
  min-width:220px;
  flex:1 1 220px;
  max-width:245px;
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  flex-direction:column;
  font-size:19px;
}

.big-choice .emoji {
  font-size:34px;
  line-height:1;
}

.section-title {
  font-size:26px;
  margin:0 0 18px;
  font-weight:700;
}

.speed-row button {
  min-width:150px;
}

.speed-btn {
  background:#f4f0ea;
  color:var(--text);
  min-height:78px;
  font-size:44px;
}

.correct {
  background:var(--green2);
  color:#236d4c;
  min-width:180px;
}

.repeat {
  background:var(--orange2);
  color:#8b581e;
  min-width:180px;
}

.menu-btn {
  position:absolute;
  left:14px;
  top:14px;
  width:54px;
  height:54px;
  min-height:54px;
  padding:0;
  font-size:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  box-shadow:0 6px 15px rgba(0,0,0,.08);
}

.timer-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
  font-weight:700;
  color:var(--muted);
  font-size:17px;
}

.timer {
  font-size:24px;
  color:var(--text);
}

.progressbar {
  width:100%;
  height:12px;
  background:#eee9e1;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:18px;
}

.progress {
  height:100%;
  width:100%;
  background:var(--yellow);
  transition:width .2s linear;
}

.word-stage {
  min-height:230px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.word {
  font-size:clamp(54px,11vw,100px);
  font-weight:700;
  letter-spacing:.5px;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.1;
}

.word.sentence {
  font-size:clamp(38px,7vw,64px);
  line-height:1.18;
}

.word.long-sentence {
  font-size:clamp(32px,6vw,52px);
}

.partner-label {
  margin:0 0 12px;
  font-size:17px;
  color:var(--muted);
}

.scoreline {
  margin-top:16px;
  font-size:17px;
  color:var(--muted);
}

.scoreline b {
  color:var(--text);
}

.countdown {
  font-size:clamp(70px,15vw,120px);
  font-weight:900;
  color:var(--yellow);
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.result-number {
  font-size:clamp(60px,12vw,100px);
  font-weight:900;
  margin:8px 0 0;
  color:var(--yellow);
}

.result-text {
  font-size:22px;
  font-weight:700;
  margin-bottom:8px;
}

.small {
  color:var(--muted);
  line-height:1.5;
  margin-bottom:20px;
  font-size:16px;
}

.home-result {
  min-width:72px !important;
  font-size:28px !important;
}

.celebration {
  position:relative;
  height:112px;
  margin:-6px 0 0;
}

.trophy {
  position:relative;
  z-index:3;
  font-size:78px;
  line-height:1;
  animation:trophyPop .75s cubic-bezier(.2,.9,.25,1.25) both;
}

.confetti-layer {
  position:absolute;
  inset:-18px 0 0;
  overflow:hidden;
  pointer-events:none;
}

.confetti-piece {
  position:absolute;
  top:-12px;
  width:10px;
  height:16px;
  border-radius:3px;
  opacity:.95;
  animation:confettiFall var(--fall,1.7s) ease-in var(--delay,0s) both;
}

.confetti-piece:nth-child(5n+1){background:#f4b942}
.confetti-piece:nth-child(5n+2){background:#e98973}
.confetti-piece:nth-child(5n+3){background:#76b7b2}
.confetti-piece:nth-child(5n+4){background:#9d82c4}
.confetti-piece:nth-child(5n){background:#7fb069}

.adapt-overlay {
  position:fixed;
  inset:0;
  z-index:30;
  background:rgba(255,250,242,.91);
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.adapt-icon {
  font-size:105px;
}

.fly-up { animation:flyUp .42s ease-in forwards; }
.hop-in { animation:hopIn .58s cubic-bezier(.2,.8,.2,1) forwards; }
.hop-out { animation:hopOut .42s ease-in forwards; }
.turtle-in { animation:turtleIn .62s ease-out forwards; }

@keyframes flyUp {
  to { transform:translateY(-180px) rotate(12deg); opacity:0; }
}

@keyframes hopIn {
  0% { transform:translateX(170px) translateY(25px); opacity:0; }
  60% { transform:translateX(-10px) translateY(-18px); opacity:1; }
  100% { transform:none; opacity:1; }
}

@keyframes hopOut {
  to { transform:translateX(-170px) translateY(-20px); opacity:0; }
}

@keyframes turtleIn {
  0% { transform:translateX(120px); opacity:0; }
  100% { transform:none; opacity:1; }
}

@keyframes trophyPop {
  0% { transform:scale(.25) rotate(-10deg); opacity:0; }
  65% { transform:scale(1.12) rotate(4deg); opacity:1; }
  100% { transform:scale(1) rotate(0); }
}

@keyframes confettiFall {
  0% { transform:translateY(-10px) rotate(0deg); opacity:0; }
  10% { opacity:1; }
  100% { transform:translateY(135px) rotate(520deg); opacity:0; }
}

@media (max-width:560px) {
  body { padding-top:14px; }
  .card { padding:18px 14px; border-radius:19px; }
  .partner-row button { flex:1 1 145px; }
  .timer-row { font-size:14px; }
  .big-choice { max-width:none; min-height:74px; }
}

</style>
</head>

</div>

const LESSMANN_WORDS = ["die Schere", "das Eis", "der Esel", "mein Arm", "meine Beine", "ganz klein", "ganz groß", "bei uns", "viele Sachen", "etwas mehr Geld", "über mir", "neue Schuhe", "schon wieder", "nichts gesehen", "am Tag", "auf meinen Kopf", "auf meiner Nase", "an der Ampel", "ich und du", "in meinem Haus", "das erste Mal", "aber nicht hier", "wenn ich schlafe", "um acht Uhr", "vor der Schule", "in einer Tasche", "mit einem Stift", "nur noch zwei Tage", "weil Mama es will"];
const LESSMANN_SHORT = ["Ich bin da.", "Ich kann schreiben.", "Sie wurde groß.", "Was war los?", "Sie sagte es.", "Sie war weg.", "Wir haben einen Hund.", "Ich mag alle Hunde.", "Ich mag auch Pferde.", "Ich kann schon lesen.", "Wir haben viele Bücher.", "Sie sind grün und rot.", "Er findet sich gut.", "Er sah so groß aus.", "Er spielt Fußball.", "Sie stand im Tor.", "Er hat sie gerne.", "Und dann kam Oma.", "Wir werden immer größer.", "Ich will zu ihm.", "Das wäre so schön.", "Alles war toll."];
const LESSMANN_LONG = ["Sie hatte eine Maus.", "Ich habe mich gefreut.", "Mein Vater ging in die Stadt.", "Er ist größer als sein Bruder.", "Das ist mein Onkel.", "Meine Mutter ist lieb.", "Sie mag ihre Schwester.", "Es war einmal ein Hase.", "Er wollte noch bleiben.", "Sie gingen nach oben.", "Danach sind wir gegangen.", "Ich muss zum Arzt.", "Wir waren bei Opa.", "Malen macht Spaß.", "Ich war bei Papa.", "Dort gibt es Kuchen.", "Heute kommt mein Fahrrad.", "Wir bekommen einen Fußball.", "Gestern war es warm.", "Morgen wird es kalt.", "Liebe Tante Ina!", "Wie geht es dir?", "Mir geht es gut.", "Ich muss ins Bett.", "Viele Grüße von …", "Ich fand es sehr schwer.", "Ich habe es dir ja gesagt."];

const SPEEDS_WORDS = [1200,700,400];
const SPEEDS_SENTENCES = [3000,2000,1200];
const SPEED_ICONS = ["🐢","🐇","🚀"];

const screens = {
  home:document.getElementById("home"),
  level:document.getElementById("level"),
  speed:document.getElementById("speed"),
  countdown:document.getElementById("countdown"),
  reading:document.getElementById("reading"),
  end:document.getElementById("end")
};
const menuBtn=document.getElementById("menuBtn");
const wordEl=document.getElementById("word");
const timerEl=document.getElementById("timer");
const progressEl=document.getElementById("progress");
const correctCountEl=document.getElementById("correctCount");
const shownCountEl=document.getElementById("shownCount");
const repeatCountEl=document.getElementById("repeatCount");
const correctBtn=document.getElementById("correctBtn");
const repeatBtn=document.getElementById("repeatBtn");
const speedIconEl=document.getElementById("currentSpeedIcon");
const adaptOverlay=document.getElementById("adaptOverlay");
const adaptIcon=document.getElementById("adaptIcon");

let mode=null, pool=[], deck=[], deckIndex=0;
let speedIndex=1;
let correctCount=0, shownCount=0, repeatCount=0, currentRepeats=0;
let hardStreak=0, currentItem="";
let roundStart=0, pausedTotal=0, pauseStart=0, timerRAF=null, roundEnded=false;
let flashTimer=null;

function show(name){
  Object.values(screens).forEach(s=>s.classList.add("hidden"));
  screens[name].classList.remove("hidden");
  menuBtn.classList.toggle("hidden", name==="home");
}
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function choosePool(){
  if(mode==="frequent") pool=FREQUENT;
  if(mode==="story") pool=STORY;
  if(mode==="words") pool=LESSMANN_WORDS;
  if(mode==="short") pool=LESSMANN_SHORT;
  if(mode==="long") pool=LESSMANN_LONG;
}
function duration(){
  return (mode==="short"||mode==="long") ? SPEEDS_SENTENCES[speedIndex] : SPEEDS_WORDS[speedIndex];
}
function setWordClass(){
  wordEl.className="word";
  if(mode==="short") wordEl.classList.add("sentence");
  if(mode==="long") wordEl.classList.add("sentence","long-sentence");
}
function nextFromDeck(){
  if(deckIndex>=deck.length){deck=shuffle(pool);deckIndex=0;}
  return deck[deckIndex++];
}
function setButtons(enabled){
  correctBtn.disabled=!enabled; repeatBtn.disabled=!enabled;
}
function flash(item, isRepeat=false){
  clearTimeout(flashTimer);
  currentItem=item;
  setWordClass();
  wordEl.textContent=item;
  setButtons(false);
  if(!isRepeat){ shownCount++; shownCountEl.textContent=shownCount; }
  flashTimer=setTimeout(()=>{
    wordEl.textContent="";
    if(!roundEnded) setButtons(true);
  },duration());
}
function newItem(){
  currentRepeats=0;
  flash(nextFromDeck(),false);
}
function elapsedActive(){
  const extraPause = pauseStart ? (performance.now()-pauseStart) : 0;
  return performance.now()-roundStart-pausedTotal-extraPause;
}
function tick(){
  if(roundEnded)return;
  const elapsed=elapsedActive();
  const remain=Math.max(0,60000-elapsed);
  timerEl.textContent="0:"+String(Math.ceil(remain/1000)).padStart(2,"0");
  progressEl.style.width=(remain/60000*100)+"%";
  if(remain<=0){finishRound();return;}
  timerRAF=requestAnimationFrame(tick);
}
function startPause(){
  if(!pauseStart) pauseStart=performance.now();
}
function endPause(){
  if(pauseStart){pausedTotal += performance.now()-pauseStart; pauseStart=0;}
}
function animateSpeedChange(oldIndex,newIndex){
  return new Promise(resolve=>{
    startPause();
    adaptOverlay.classList.remove("hidden");
    adaptIcon.className="adapt-icon";
    adaptIcon.textContent=SPEED_ICONS[oldIndex];
    adaptIcon.classList.add(oldIndex===2 ? "fly-up" : "hop-out");
    setTimeout(()=>{
      adaptIcon.className="adapt-icon";
      adaptIcon.textContent=SPEED_ICONS[newIndex];
      adaptIcon.classList.add(newIndex===1 ? "hop-in" : "turtle-in");
      setTimeout(()=>{
        adaptOverlay.classList.add("hidden");
        adaptIcon.className="adapt-icon";
        endPause();
        resolve();
      },650);
    },430);
  });
}
async function maybeAdaptAfterCorrect(){
  if(currentRepeats>=2) hardStreak++; else hardStreak=0;
  if(hardStreak>=2 && speedIndex>0){
    hardStreak=0;
    const old=speedIndex;
    speedIndex--;
    speedIconEl.textContent=SPEED_ICONS[speedIndex];
    await animateSpeedChange(old,speedIndex);
  }
}
async function onCorrect(){
  if(roundEnded)return;
  setButtons(false);
  correctCount++;
  correctCountEl.textContent=correctCount;
  await maybeAdaptAfterCorrect();
  if(!roundEnded)newItem();
}
function onRepeat(){
  if(roundEnded)return;
  repeatCount++; currentRepeats++;
  repeatCountEl.textContent=repeatCount;
  flash(currentItem,true);
}
function startCountdown(){
  show("countdown");
  let n=3;
  const el=document.getElementById("countdownNumber");
  el.textContent=n;
  const id=setInterval(()=>{
    n--;
    if(n>0) el.textContent=n;
    else {
      clearInterval(id);
      beginRound();
    }
  },700);
}
function beginRound(){
  choosePool(); deck=shuffle(pool); deckIndex=0;
  correctCount=shownCount=repeatCount=currentRepeats=hardStreak=0;
  correctCountEl.textContent="0"; shownCountEl.textContent="0"; repeatCountEl.textContent="0";
  speedIconEl.textContent=SPEED_ICONS[speedIndex];
  roundEnded=false; pausedTotal=0; pauseStart=0;
  show("reading");
  roundStart=performance.now();
  newItem();
  cancelAnimationFrame(timerRAF);
  tick();
}

function launchConfetti(){
  const layer=document.getElementById("confettiLayer");
  if(!layer) return;
  layer.innerHTML="";
  for(let i=0;i<34;i++){
    const piece=document.createElement("span");
    piece.className="confetti-piece";
    piece.style.left=(4+Math.random()*92)+"%";
    piece.style.setProperty("--delay",(Math.random()*.35)+"s");
    piece.style.setProperty("--fall",(1.15+Math.random()*.8)+"s");
    piece.style.transform="rotate("+(Math.random()*180)+"deg)";
    layer.appendChild(piece);
  }
  const trophy=document.querySelector(".trophy");
  if(trophy){
    trophy.style.animation="none";
    void trophy.offsetWidth;
    trophy.style.animation="";
  }
}

function finishRound(){
  if(roundEnded)return;
  roundEnded=true;
  clearTimeout(flashTimer); cancelAnimationFrame(timerRAF);
  setButtons(false); wordEl.textContent="";
  document.getElementById("resultNumber").textContent=correctCount;
  document.getElementById("resultDetails").textContent=`Gezeigt: ${shownCount} · Wiederholt: ${repeatCount}`;
  show("end");
  launchConfetti();
}
document.querySelectorAll("[data-home]").forEach(btn=>btn.addEventListener("click",()=>{
  const value=btn.dataset.home;
  if(value==="sentences"){show("level");return;}
  mode=value; show("speed");
}));
document.querySelectorAll("[data-level]").forEach(btn=>btn.addEventListener("click",()=>{
  mode=btn.dataset.level; show("speed");
}));
document.querySelectorAll("[data-speed]").forEach(btn=>btn.addEventListener("click",()=>{
  speedIndex=Number(btn.dataset.speed); startCountdown();
}));
correctBtn.addEventListener("click",onCorrect);
repeatBtn.addEventListener("click",onRepeat);
menuBtn.addEventListener("click",()=>{
  roundEnded=true; clearTimeout(flashTimer); cancelAnimationFrame(timerRAF); show("home");
});
document.getElementById("homeBtn").addEventListener("click",()=>show("home"));
document.getElementById("againBtn").addEventListener("click",()=>show("speed"));
</script>
